<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>課務事前準備系統</title>

<!-- ===================================================================
     Firebase 設定（沿用 airport-car 專案，使用 cp_ 開頭的獨立資料表）
==================================================================== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, setDoc, getDoc, query, orderBy }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOHDCmnhV4djJnaVwhp1P3Ucand_DJ4M8",
  authDomain: "airport-car.firebaseapp.com",
  projectId: "airport-car",
  storageBucket: "airport-car.firebasestorage.app",
  messagingSenderId: "497915579586",
  appId: "1:497915579586:web:c03ae3f86abfd5a01f7f5b"
};

try {
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  window.fb = { db, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, setDoc, getDoc, query, orderBy };
  window.dispatchEvent(new Event("fb-ready"));
} catch (e) {
  window.fbError = e.message;
  window.dispatchEvent(new Event("fb-error"));
}
</script>

<style>
:root{
  --brand:#e2809a; --brand-d:#c95f7d; --brand-strong:#22357a; --page-bg:#fdf1e8;
  --navy:#22357a; --navy-d:#152252; --navy-soft:#e6eaf6;
  --ink:#2c2a3a; --line:#f5dde3; --hair:rgba(44,42,58,.10);
  --ok:#4f9c5f; --ok-bg:#e7f5ea;
  --red:#d9564f; --red-bg:#fdeae8;
  --card:#ffffff; --card-highlight:rgba(255,255,255,.8);
  --muted:#8d7a82;
  --ring:rgba(226,128,154,.42);
}
/* 品牌走明亮米白＋深藍＋玫瑰粉風格，維持固定不隨系統深色模式切換，確保視覺跟形象學院海報一致 */
*{ box-sizing:border-box; margin:0; padding:0; }
body{ font-family:-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif; background:var(--page-bg); color:var(--ink); padding-bottom:60px; }
h1,h3.sec,.cal-head b,.sheet-head b,.pin-box b{ font-family:"Songti TC","Noto Serif TC","PMingLiU",serif; }
header{ background:var(--brand-strong); color:#fff; padding:18px 16px 14px; text-align:center; position:relative; border-bottom:3px solid var(--brand); }
header h1{ font-size:19px; letter-spacing:1px; font-weight:700; }
header .sub{ font-size:12px; opacity:.85; margin-top:4px; }
.brand-line{ display:flex; align-items:center; justify-content:center; gap:6px; margin-bottom:7px; opacity:.85; }
.brand-mark{ display:inline-flex; flex-shrink:0; }
.brand-word{ font-family:"Songti TC","Noto Serif TC","PMingLiU",serif; font-style:italic; font-size:12.5px; letter-spacing:.4px; }
.brand-word b{ font-style:normal; font-weight:700; margin-left:3px; letter-spacing:1px; }
.brand-badge{ display:inline-flex; vertical-align:-6px; margin-right:2px; opacity:.95; }
header .gear{ position:absolute; right:14px; top:14px; background:rgba(255,255,255,.16); border:none; color:#fff; width:38px; height:38px; border-radius:10px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background-color .15s ease; }
header .gear:hover{ background:rgba(255,255,255,.28); }
header .gear:active{ transform:scale(.94); }
header .gear:focus-visible{ outline:none; box-shadow:0 0 0 3px rgba(255,255,255,.55); }
main{ max-width:640px; margin:0 auto; padding:14px 12px; }
.err-banner{ background:var(--red-bg); border:1px solid var(--red); color:var(--red); border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:12px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:12px;
  box-shadow:inset 0 1px 0 var(--card-highlight), 0 1px 3px rgba(34,48,92,.06), 0 8px 18px -10px rgba(34,48,92,.16);
  transition:border-color .18s ease, box-shadow .18s ease; }
.card.todo-active{ border-color:var(--brand); box-shadow:inset 0 1px 0 var(--card-highlight), 0 2px 6px rgba(217,138,156,.16), 0 16px 30px -16px rgba(217,138,156,.34); }
h3.sec{ color:var(--navy); font-size:15px; margin-bottom:10px; display:flex; align-items:center; gap:8px; font-weight:700; }
.icon-badge{ display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px; border-radius:50%; flex-shrink:0; background:var(--navy-soft); color:var(--navy); }
.icon-badge-sm{ width:22px; height:22px; }
.icon-badge-sm .ic{ width:13px; height:13px; }
.icon-badge-lg{ width:56px; height:56px; margin:0 auto; }
.icon-badge-lg .ic{ width:28px; height:28px; }
.date-pill{ display:inline-block; background:var(--navy-soft); color:var(--navy); padding:4px 14px; border-radius:99px; font-weight:700; }
.muted{ color:var(--muted); font-size:12px; }
.empty{ text-align:center; color:var(--muted); padding:24px 0; font-size:14px; }
.ic{ display:block; }
.btn{ border:none; border-radius:10px; padding:11px 16px; font-size:14px; font-weight:800; cursor:pointer;
  transition:background-color .16s ease, color .16s ease, border-color .16s ease, transform .12s ease, opacity .16s ease;
  display:inline-flex; align-items:center; justify-content:center; gap:6px; }
.btn-main{ background:var(--brand); color:#fff; }
.btn-main:hover{ background:var(--brand-d); }
.btn-main:active{ transform:scale(.98); }
.btn-ghost{ background:transparent; border:1.5px solid var(--navy); color:var(--navy); }
.btn-ghost:hover{ background:var(--navy-soft); }
.btn-ghost:active{ transform:scale(.98); }
.btn-sm{ padding:6px 12px; font-size:12px; border-radius:8px; }
.btn-red{ background:var(--red-bg); color:var(--red); }
.btn-red:hover{ filter:brightness(.96); }
.btn:disabled{ opacity:.5; cursor:default; transform:none !important; }
.btn:focus-visible,input:focus-visible,select:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }

/* 我的待辦事項 */
.todo-item{ display:flex; align-items:center; gap:9px; padding:9px 2px; border-bottom:1px dotted var(--line); font-size:14px; max-height:70px; overflow:hidden; }
.todo-item:last-child{ border-bottom:none; }
input[type=checkbox].todo-checkbox{ appearance:none; -webkit-appearance:none; width:20px; height:20px; border:1.6px solid var(--line); border-radius:6px; flex-shrink:0; cursor:pointer; position:relative; transition:background-color .15s ease, border-color .15s ease; }
input[type=checkbox].todo-checkbox:hover{ border-color:var(--brand); }
input[type=checkbox].todo-checkbox:checked{ background:var(--brand); border-color:var(--brand); }
input[type=checkbox].todo-checkbox:checked::after{ content:""; position:absolute; left:6px; top:2px; width:5px; height:10px; border:solid #fff; border-width:0 2px 2px 0; transform:rotate(45deg); animation:checkPop .28s cubic-bezier(.34,1.56,.64,1) both; }
input[type=checkbox].todo-checkbox:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }
@keyframes checkPop{ from{ transform:rotate(45deg) scale(0); opacity:0; } to{ transform:rotate(45deg) scale(1); opacity:1; } }
.todo-item .t{ flex:1; }
.todo-item.auto{ color:var(--navy); font-weight:700; }
.todo-item.auto .icon-badge{ margin-right:1px; }
.todo-item .del{ background:none; border:none; color:var(--muted); cursor:pointer; width:32px; height:32px; border-radius:8px; flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:background-color .15s ease, color .15s ease; }
.todo-item .del:hover{ background:var(--red-bg); color:var(--red); }
.todo-item .del:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }
.todo-item.todo-exit{ animation:todoExit .46s cubic-bezier(.4,0,.6,1) forwards; }
.todo-item.todo-exit .t{ text-decoration:line-through; color:var(--muted); }
@keyframes todoExit{
  0%{ background:transparent; opacity:1; transform:translateX(0); max-height:70px; }
  18%{ background:var(--page-bg); }
  55%{ background:transparent; opacity:1; transform:translateX(0); max-height:70px; }
  100%{ opacity:0; transform:translateX(18px); max-height:0; padding-top:0; padding-bottom:0; margin:0; border-color:transparent; }
}
.todo-item.todo-delete-exit{ animation:todoDeleteExit .26s cubic-bezier(.4,0,1,1) forwards; }
@keyframes todoDeleteExit{
  0%{ opacity:1; transform:translateX(0); max-height:70px; }
  100%{ opacity:0; transform:translateX(18px); max-height:0; padding-top:0; padding-bottom:0; margin:0; border-color:transparent; }
}
.assign-form{ margin-top:12px; padding-top:12px; border-top:1px dotted var(--line); }
.todo-add{ display:flex; gap:8px; margin-top:10px; }
.todo-add input{ flex:1; padding:9px 10px; border:1.5px solid var(--line); border-radius:10px; font-size:14px; background:var(--card); color:var(--ink); transition:border-color .15s ease; }
.todo-add input:focus{ outline:none; border-color:var(--brand); }
.todo-add input:disabled{ opacity:.6; }

/* 月曆（Google 行事曆風格：跨天課程用一整條色塊延伸過去，色塊上直接顯示名稱） */
.cal-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
.cal-head b{ font-size:15px; font-variant-numeric:tabular-nums; }
.cal-nav{ background:var(--navy-soft); border:none; color:var(--navy); width:32px; height:32px; border-radius:9px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background-color .15s ease, transform .12s ease; }
.cal-nav:hover{ background:var(--line); }
.cal-nav:active{ transform:scale(.92); }
.cal-nav:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }
.cal-week{ display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--muted); margin-bottom:4px; }
.cal-body{ touch-action:pan-y; }
.cal-week-row{ margin-bottom:5px; padding-bottom:5px; border-bottom:1px dotted var(--line); }
.cal-week-row:last-child{ border-bottom:none; }
.cal-daynum-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
.cal-day-cell{ position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:26px; border-radius:8px; cursor:pointer; transition:background-color .15s ease, transform .1s ease; }
.cal-day-cell:hover{ background:var(--hair); }
.cal-day-cell:active{ transform:scale(.94); }
.cal-day-cell:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }
.cal-day-cell.blank{ visibility:hidden; cursor:default; }
.cal-daynum{ font-size:11px; font-weight:700; color:var(--ink); font-variant-numeric:tabular-nums; }
.cal-day-cell.today .cal-daynum{ background:var(--navy); color:#fff; width:19px; height:19px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; }
.cal-todo-dot{ width:5px; height:5px; border-radius:50%; background:var(--brand); margin-top:2px; transition:background-color .2s ease; }
.cal-todo-dot.done{ background:var(--ok); }
.cal-events-row{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px 4px; margin-top:3px; }
.cal-event-bar{ font-size:10px; font-weight:700; color:#fff; padding:2px 6px; border-radius:6px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; transition:filter .15s ease, transform .1s ease; line-height:1.5; }
.cal-event-bar:hover{ filter:brightness(1.1); }
.cal-event-bar:active{ transform:scale(.97); }
.cal-event-bar:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }

/* 彈窗 */
.overlay{ position:fixed; inset:0; background:rgba(20,16,28,.5); display:flex; align-items:flex-end; justify-content:center; z-index:100; animation:overlayIn .18s ease-out both; }
@keyframes overlayIn{ from{ opacity:0; } to{ opacity:1; } }
.sheet{ background:var(--card); color:var(--ink); width:100%; max-width:640px; border-radius:18px 18px 0 0; padding:16px; max-height:82vh; overflow-y:auto; animation:sheetIn .2s cubic-bezier(.16,1,.3,1) both; }
@keyframes sheetIn{ from{ transform:translateY(24px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.sheet-head b{ font-size:16px; }
.sheet-head .x{ background:none; border:none; color:var(--muted); cursor:pointer; width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; transition:background-color .15s ease; }
.sheet-head .x:hover{ background:var(--hair); }
.sheet-head .x:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }
.course-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dotted var(--line); max-height:70px; overflow:hidden; transition:border-color .2s; }
.course-row.course-exit{ animation:todoDeleteExit .3s cubic-bezier(.4,0,1,1) forwards; }
.course-row .dot{ width:11px; height:11px; border-radius:50%; flex-shrink:0; }
.course-row .ci{ flex:1; min-width:0; }
.course-row .cn{ font-weight:700; font-size:14px; }
.course-row .cm{ font-size:12px; color:var(--muted); margin-top:2px; }

/* 表單 */
.field{ margin-bottom:12px; }
.field label{ display:block; font-size:13px; font-weight:700; margin-bottom:5px; color:var(--navy); }
.field input,.field select{ width:100%; padding:10px; border:1.5px solid var(--line); border-radius:10px; font-size:15px; background:var(--card); color:var(--ink); transition:border-color .15s ease; }
.field input:focus,.field select:focus{ outline:none; border-color:var(--brand); }
.field-row{ display:flex; gap:10px; }
.field-row .field{ flex:1; }

/* 後台類別／帳號管理 */
.cat-row{ display:grid; grid-template-columns:1fr 56px 56px 40px; gap:6px; align-items:center; margin-bottom:8px; }
.cat-row input{ padding:8px 7px; border:1px solid var(--line); border-radius:8px; font-size:13px; width:100%; background:var(--card); color:var(--ink); transition:border-color .15s ease; }
.cat-row input:focus{ outline:none; border-color:var(--brand); }
.cat-row .del{ background:none; border:none; color:var(--red); cursor:pointer; width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; transition:background-color .15s ease; }
.cat-row .del:hover{ background:var(--red-bg); }
.cat-row .del:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }
.cat-head-row{ display:grid; grid-template-columns:1fr 56px 56px 40px; gap:6px; font-size:11px; color:var(--muted); margin-bottom:4px; }
.cat-row-removed{ display:flex; align-items:center; justify-content:space-between; padding:8px 10px; background:var(--hair); border-radius:8px; margin-bottom:8px; font-size:13px; color:var(--muted); animation:catRemoved .18s ease both; }
@keyframes catRemoved{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
.acct-row{ display:grid; grid-template-columns:1fr 1fr 88px 40px; gap:6px; align-items:center; margin-bottom:8px; }
.acct-row input,.acct-row select{ padding:8px 7px; border:1px solid var(--line); border-radius:8px; font-size:13px; width:100%; background:var(--card); color:var(--ink); transition:border-color .15s ease; }
.acct-row input:focus,.acct-row select:focus{ outline:none; border-color:var(--brand); }
.acct-row .del{ background:none; border:none; color:var(--red); cursor:pointer; width:36px; height:36px; border-radius:8px; display:flex; align-items:center; justify-content:center; transition:background-color .15s ease; }
.acct-row .del:hover{ background:var(--red-bg); }
.acct-row .del:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }
.acct-head-row{ display:grid; grid-template-columns:1fr 1fr 88px 40px; gap:6px; font-size:11px; color:var(--muted); margin-bottom:4px; }
.status-tag{ font-size:11px; font-weight:700; padding:3px 10px; border-radius:99px; flex-shrink:0; white-space:nowrap; display:inline-flex; align-items:center; gap:3px; }
.status-tag .ic{ width:11px; height:11px; }
.status-done{ background:var(--ok-bg); color:var(--ok); }
.status-pending{ background:var(--navy-soft); color:var(--navy); }

/* 登入畫面 */
.pin-box{ max-width:320px; margin:60px auto; text-align:center; }
.pin-box input{ font-size:24px; text-align:center; letter-spacing:8px; width:200px; padding:10px; border:2px solid var(--brand); border-radius:12px; margin:14px 0; background:var(--card); color:var(--ink); }
.pin-box input:focus-visible{ outline:none; box-shadow:0 0 0 3px var(--ring); }
.pin-box.shake{ animation:pinShake .32s ease; }
@keyframes pinShake{ 0%,100%{ transform:translateX(0); } 20%{ transform:translateX(-8px); } 40%{ transform:translateX(7px); } 60%{ transform:translateX(-5px); } 80%{ transform:translateX(3px); } }
.pin-err{ color:var(--red); font-size:13px; margin-top:10px; }
.pin-hint{ margin-top:12px; font-size:12px; }
.acct-pick-list{ display:flex; flex-direction:column; gap:8px; margin-top:16px; }
.acct-pick-btn{ width:100%; }

/* 提示條 toast */
.toast{ position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--ink); color:var(--page-bg); padding:11px 10px 11px 18px; border-radius:12px; display:flex; align-items:center; gap:14px; font-size:13.5px; box-shadow:0 10px 30px -8px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.15); z-index:200; animation:toastIn .2s cubic-bezier(.16,1,.3,1) both; max-width:calc(100% - 32px); }
@keyframes toastIn{ from{ opacity:0; transform:translateX(-50%) translateY(12px); } to{ opacity:1; transform:translateX(-50%) translateY(0); } }
.toast button{ background:rgba(255,255,255,.16); border:none; color:inherit; font-weight:700; padding:6px 12px; border-radius:8px; cursor:pointer; flex-shrink:0; transition:background-color .15s ease; }
.toast button:hover{ background:rgba(255,255,255,.28); }

/* 骨架載入 */
.skeleton-card .sk-line{ height:14px; border-radius:6px; margin-bottom:10px; background:linear-gradient(90deg, var(--line) 25%, var(--hair) 37%, var(--line) 63%); background-size:400% 100%; animation:skShimmer 1.4s ease infinite; }
.sk-w40{ width:40%; } .sk-w90{ width:90%; } .sk-w70{ width:70%; height:20px; }
@keyframes skShimmer{ 0%{ background-position:100% 0; } 100%{ background-position:0 0; } }
.sk-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-top:12px; }
.sk-cell{ height:52px; border-radius:8px; background:var(--line); }

/* 畫面切換轉場（登入步驟／首頁↔後台） */
@keyframes viewExit{ to{ opacity:0; transform:translateY(-8px) scale(.99); } }
@keyframes viewEnter{ from{ opacity:0; transform:translateY(10px) scale(.99); } to{ opacity:1; transform:translateY(0) scale(1); } }
#view.view-exit{ animation:viewExit .15s cubic-bezier(.4,0,1,1) forwards; }
#view.view-enter{ animation:viewEnter .24s cubic-bezier(.16,1,.3,1) both; }

/* 月曆左右滑動的頁面轉場 */
@keyframes calExitL{ to{ opacity:0; transform:translateX(-18px); } }
@keyframes calExitR{ to{ opacity:0; transform:translateX(18px); } }
@keyframes calEnterL{ from{ opacity:0; transform:translateX(-18px); } to{ opacity:1; transform:translateX(0); } }
@keyframes calEnterR{ from{ opacity:0; transform:translateX(18px); } to{ opacity:1; transform:translateX(0); } }
#calRegion.cal-exit-l{ animation:calExitL .13s cubic-bezier(.4,0,1,1) forwards; }
#calRegion.cal-exit-r{ animation:calExitR .13s cubic-bezier(.4,0,1,1) forwards; }
#calRegion.cal-enter-l{ animation:calEnterL .22s cubic-bezier(.16,1,.3,1) both; }
#calRegion.cal-enter-r{ animation:calEnterR .22s cubic-bezier(.16,1,.3,1) both; }

/* 彈窗關閉退場 */
.overlay.overlay-exit{ animation:overlayOut .14s ease-in forwards; }
@keyframes overlayOut{ to{ opacity:0; } }
.sheet.sheet-exit{ animation:sheetOut .14s cubic-bezier(.4,0,1,1) forwards; }
@keyframes sheetOut{ to{ transform:translateY(22px); opacity:0; } }

::selection{ background:var(--brand); color:#fff; }

@media (prefers-reduced-motion: reduce){
  *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
}
</style>
</head>
<body>

<header>
  <div class="brand-line">
    <svg class="brand-mark" viewBox="0 0 40 34" width="26" height="22" fill="none">
      <path d="M20 10C16 2 4 4 4 14c0 8 9 14 16 18" stroke="#e2809a" stroke-width="2.6" stroke-linecap="round"/>
      <path d="M20 10c4-8 16-6 16 4 0 8-9 14-16 18" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round"/>
    </svg>
    <span class="brand-word">E Dream <b>時尚形象學院</b></span>
  </div>
  <h1><span class="brand-badge" id="brandBadge"></span> 課務事前準備系統</h1>
  <div class="sub" id="headerSub">形象顧問課務行事曆</div>
  <button class="gear" id="gearBtn" style="display:none;right:60px" onclick="toggleSettings()" aria-label="設定"></button>
  <button class="gear" id="logoutBtn" style="display:none" onclick="logout()" aria-label="登出"></button>
</header>

<main id="view"><div class="empty">載入中…</div></main>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>

function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function pad(n){ return String(n).padStart(2,"0"); }
function fmtYMD(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function parseYMD(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12, 0, 0); }
function todayStr(){ return fmtYMD(new Date()); }
function addDaysStr(s, n){ const d = parseYMD(s); d.setDate(d.getDate()+n); return fmtYMD(d); }
function diffDaysStr(a, b){ return Math.round((parseYMD(b) - parseYMD(a)) / 86400000); }
function dateLabel(s){ const d = parseYMD(s); return `${d.getMonth()+1}月${d.getDate()}日 星期${WEEKDAYS[d.getDay()]}`; }
function allCategories(){ return settings.categories.concat([OTHER_CAT]); }
function catColor(catId){ const list = allCategories(); const idx = list.findIndex(c=>c.id===catId); return CAT_COLORS[idx>=0 ? idx % CAT_COLORS.length : 0]; }
function accountList(){ return (settings.accounts && settings.accounts.length) ? settings.accounts : DEFAULT_ACCOUNTS; }
function accountName(id){ const a = accountList().find(x=>x.id===id); return a ? a.name : "（未知帳號）"; }
function isHighAccount(){ return !!(currentAccount && currentAccount.role === "high"); }

/* ================= 提示條（成功訊息／可復原的刪除） ================= */
function commitPendingToast(){ if (toast){ clearTimeout(toast.timerId); toast.onCommit(); toast=null; } }
function showToast(message, onCommit, onRestore){
  commitPendingToast();
  const ms = onRestore ? 4500 : 2200;
  const timerId = setTimeout(()=>{ toast=null; onCommit(); renderToastRoot(); }, ms);
  toast = { message, timerId, onCommit, onRestore };
  renderToastRoot();
}
function clickUndoToast(){
  if (!toast || !toast.onRestore) return;
  clearTimeout(toast.timerId);
  const restore = toast.onRestore;
  toast = null; renderToastRoot();
  restore();
}
function renderToastRoot(){
  const el = document.getElementById("toastRoot");
  if (!el) return;
  if (!toast){ el.innerHTML = ""; return; }
  el.innerHTML = `<div class="toast"><span>${esc(toast.message)}</span>${toast.onRestore ? `<button onclick="clickUndoToast()">復原</button>` : ""}</div>`;
}

/* ================= Firebase 連線 ================= */
window.addEventListener("fb-ready", () => {
  fbReady = true;
  const { db, doc, setDoc, onSnapshot, collection } = window.fb;

  onSnapshot(doc(db,"cp_settings","app"), snap => {
    if (snap.exists()) {
      const data = snap.data();
      settings = {
        categories: Array.isArray(data.categories) && data.categories.length ? data.categories : DEFAULT_CATEGORIES.slice(),
        accounts: Array.isArray(data.accounts) && data.accounts.length ? data.accounts : DEFAULT_ACCOUNTS.slice()
      };
    } else {
      settings = { categories: DEFAULT_CATEGORIES.slice(), accounts: DEFAULT_ACCOUNTS.slice() };
      setDoc(doc(db,"cp_settings","app"), settings).catch(()=>{});
    }
    render();
  }, err => console.warn("settings", err));

  onSnapshot(collection(db,"cp_courses"), snap => {
    courses = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, err => console.warn("courses", err));

  onSnapshot(collection(db,"cp_todos"), snap => {
    todos = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    render();
  }, err => console.warn("todos", err));
});
window.addEventListener("fb-error", () => { fbFail = true; render(); });

/* ================= 畫面轉場（每次切換都帶退場＋進場動畫，才有「體感」） ================= */
function animatedRender(mutateFn, delay){
  const v = document.getElementById("view");
  if (!v || !v.firstChild) { mutateFn(); render(); return; }
  v.classList.remove("view-enter");
  void v.offsetWidth;
  v.classList.add("view-exit");
  setTimeout(()=>{
    mutateFn();
    render();
    const v2 = document.getElementById("view");
    v2.classList.remove("view-exit");
    void v2.offsetWidth;
    v2.classList.add("view-enter");
  }, delay || 150);
}

  const inputEl = document.getElementById("pinInput");
  const v = (inputEl.value || "").trim();
  const acc = accountList().find(a=>a.id===loginPickedId);
  if (acc && v === acc.password) {
    animatedRender(()=>{
      currentAccount = { id:acc.id, name:acc.name, role:acc.role };
      sessionStorage.setItem("cp_account", JSON.stringify(currentAccount));
      loginStep = "pick"; loginPickedId = null;
    }, 160);
    return;
  }
  const box = document.getElementById("pinBox");
  if (box){ box.classList.remove("shake"); void box.offsetWidth; box.classList.add("shake"); }
  let errEl = document.getElementById("pinErr");
  if (!errEl && box){ errEl = document.createElement("div"); errEl.id = "pinErr"; errEl.className = "pin-err"; box.appendChild(errEl); }
  if (errEl) errEl.textContent = "密碼錯誤，請再試一次";
  inputEl.value = ""; inputEl.focus();
}

/* ================= 首頁：我的待辦事項 ================= */
function autoTodoItems(){
  const today = todayStr();
  const items = [];
  for (const c of courses) {
    if (today >= c.startDate && today <= c.endDate) {
      items.push(`<span class="icon-badge icon-badge-sm">${ICONS.calendar}</span><span class="t">今天有課：${esc(c.categoryName)}${c.startDate!==c.endDate ? "（多日課程）" : ""}</span>`);
    } else {
      const until = diffDaysStr(today, c.startDate);
      if (until > 0 && until === Number(c.reminderLeadDays)) {
        items.push(`<span class="icon-badge icon-badge-sm">${ICONS.clock}</span><span class="t">${until} 天後開課提醒：${esc(c.categoryName)}（該打電話確認／發通知了）</span>`);
      }
    }
  }
  return items;
}
function nextUpcomingCourse(){
  const today = todayStr();
  const upcoming = courses.filter(c=>c.startDate>today).sort((a,b)=> a.startDate<b.startDate?-1:1);
  return upcoming[0] || null;
}
function myTodos(){
  if (!currentAccount) return [];
  return todos.filter(t => t.assignedTo === currentAccount.id);
}
function dayTodos(dateStr){ return todos.filter(t => t.date === dateStr); }

function renderTodoCard(){
  const auto = autoTodoItems();
  const today = todayStr();
  const manual = myTodos()
    .filter(t => (!t.done && (t.date||today) <= today) || exitingTodoIds.has(t.id))
    .sort((a,b)=> ((a.date||"")<(b.date||"")?-1:((a.date||"")>(b.date||"")?1:0)) || (a.createdAt||0)-(b.createdAt||0));
  const hasContent = auto.length || manual.length;
  const nxt = (!auto.length && !manual.length) ? nextUpcomingCourse() : null;
  const high = isHighAccount();
  return `<div class="card${hasContent?' todo-active':''}">
    <h3 class="sec"><span class="icon-badge">${ICONS.check}</span> 我的待辦事項</h3>
    ${auto.length ? auto.map(t=>`<div class="todo-item auto">${t}</div>`).join("") : ""}
    ${manual.length ? manual.map(t=>{
        const exiting = exitingTodoIds.has(t.id);
        const deleting = deletingTodoIds.has(t.id);
        const cls = exiting ? "todo-exit" : (deleting ? "todo-delete-exit" : "");
        const datePrefix = t.date && t.date !== today ? `<span class="muted" style="margin-right:5px">${t.date.slice(5)}</span>` : "";
        return `<div class="todo-item${cls?' '+cls:''}">
        <input type="checkbox" class="todo-checkbox" ${t.done||exiting?"checked":""} onchange="checkTodo('${t.id}')">
        <span class="t">${datePrefix}${esc(t.text)}</span>
        ${high ? `<button class="del" aria-label="刪除待辦" onclick="deleteTodoBtn('${t.id}')">${ICONS.x}</button>` : ""}
      </div>`;
      }).join("") : ""}
    ${(!auto.length && !manual.length) ? `<div class="empty">今天沒有代辦事項 🎉${nxt ? `<div class="muted" style="margin-top:6px">下一堂課：${nxt.startDate}．${esc(nxt.categoryName)}</div>` : ""}</div>` : ""}
    ${high ? `<div class="assign-form">
      <div class="field-row">
        <div class="field"><label>指派給</label>
          <select id="assignPerson">${accountList().map(a=>`<option value="${a.id}" ${currentAccount && a.id===currentAccount.id?"selected":""}>${esc(a.name)}</option>`).join("")}</select>
        </div>
        <div class="field" style="max-width:150px"><label>日期</label><input type="date" id="assignDate" value="${today}"></div>
      </div>
      <div class="todo-add">
        <input id="newTodoInput" ${busy.todoAdd?"disabled":""} placeholder="輸入待辦內容（例如：訂餐盒）" onkeydown="if(event.key==='Enter')assignTodo()">
        <button class="btn btn-main btn-sm" ${busy.todoAdd?"disabled":""} onclick="assignTodo()">${busy.todoAdd?"處理中":"指派"}</button>
      </div>
    </div>` : ""}
  </div>`;

async function assignTodo(){
  if (!fbReady) { alert("資料庫尚未連線，請稍後再試"); return; }
  const personEl = document.getElementById("assignPerson");
  const dateEl = document.getElementById("assignDate");
  const textEl = document.getElementById("newTodoInput");
  const text = textEl.value.trim();
  if (!text) return;
  const assignedTo = personEl.value;
  const date = dateEl.value || todayStr();
  busy.todoAdd = true; render();
  const { db, collection, addDoc } = window.fb;
  try {
    await addDoc(collection(db,"cp_todos"), { text, assignedTo, assignedBy: currentAccount.id, date, done:false, createdAt:Date.now() });
  } catch(e){ alert("指派失敗："+e.message); }
  busy.todoAdd = false; render();
  const again = document.getElementById("newTodoInput");
  if (again) again.focus();
}
function checkTodo(id){
  if (exitingTodoIds.has(id)) return;
  exitingTodoIds.add(id);
  render();
  setTimeout(()=>{
    exitingTodoIds.delete(id);
    const { db, doc, updateDoc } = window.fb;
    updateDoc(doc(db,"cp_todos",id), { done:true, doneAt:Date.now() }).catch(e=>alert("更新失敗："+e.message));
  }, 460);
}
function deleteTodoBtn(id){
  deletingTodoIds.add(id); render();
  showToast("已刪除待辦",
    ()=>{ deletingTodoIds.delete(id); const { db, doc, deleteDoc } = window.fb; deleteDoc(doc(db,"cp_todos",id)).catch(e=>alert("刪除失敗："+e.message)); },
    ()=>{ deletingTodoIds.delete(id); render(); }
  );
}

/* ================= 首頁：月曆 ================= */
function buildMonthCells(year, month){
  const first = new Date(year, month, 1);
  const startWeekday = first.getDay();
  const numDays = new Date(year, month+1, 0).getDate();
  const cells = [];
  for (let i=0;i<startWeekday;i++) cells.push(null);
  for (let d=1; d<=numDays; d++) cells.push(fmtYMD(new Date(year, month, d, 12, 0, 0)));
  while (cells.length % 7 !== 0) cells.push(null);
  return cells;
}
function dayCourses(dateStr){ return courses.filter(c => dateStr >= c.startDate && dateStr <= c.endDate); }
function buildMonthWeeks(year, month){
  const cells = buildMonthCells(year, month);
  const weeks = [];
  for (let i=0;i<cells.length;i+=7) weeks.push(cells.slice(i,i+7));
  return weeks;
}
// 把一週 7 天裡所有課程排成一條條橫向色塊，重疊的課程自動分到不同層（跟 Google 行事曆一樣的排法）
function weekEventLanes(week){
  const items = [];
  for (const c of courses){
    let startCol = -1, endCol = -1;
    for (let i=0;i<7;i++){
      const d = week[i];
      if (d && d >= c.startDate && d <= c.endDate){
        if (startCol === -1) startCol = i;
        endCol = i;
      }
    }
    if (startCol !== -1) items.push({ course:c, startCol, endCol });
  }
  items.sort((a,b)=> (a.startCol-b.startCol) || (a.endCol-b.endCol));
  const lanes = [];
  const placed = [];
  for (const it of items){
    let laneIdx = lanes.findIndex(lane => lane.every(x => it.startCol > x.endCol || it.endCol < x.startCol));
    if (laneIdx === -1){ laneIdx = lanes.length; lanes.push([]); }
    lanes[laneIdx].push({ startCol:it.startCol, endCol:it.endCol });
    placed.push({ ...it, lane: laneIdx });
  }
  return { placed, laneCount: lanes.length };
}

      <button class="cal-nav" onclick="prevMonth()" aria-label="上個月">${ICONS.chevronLeft}</button>
      <b>${viewYear} 年 ${viewMonth+1} 月</b>
      <button class="cal-nav" onclick="nextMonth()" aria-label="下個月">${ICONS.chevronRight}</button>
    </div>
    <div class="cal-week">${WEEKDAYS.map(w=>`<div>${w}</div>`).join("")}</div>
    <div class="cal-body" id="calGrid">
      ${weeks.map(week=>{
        const { placed, laneCount } = weekEventLanes(week);
        return `<div class="cal-week-row">
          <div class="cal-daynum-row">
            ${week.map(dateStr=>{
              if (!dateStr) return `<div class="cal-day-cell blank"></div>`;
              const isToday = dateStr === today;
              const dnum = Number(dateStr.slice(8,10));
              const dayT = dayTodos(dateStr);
              const hasPending = dayT.some(t=>!t.done);
              return `<div class="cal-day-cell${isToday?' today':''}" tabindex="0" role="button" aria-label="${dateStr}" onclick="openDay('${dateStr}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDay('${dateStr}')}">
                <span class="cal-daynum">${dnum}</span>
                ${dayT.length ? `<span class="cal-todo-dot${hasPending?'':' done'}" title="${hasPending?'還有未完成的指派待辦':'指派待辦已全部完成'}"></span>` : ""}
              </div>`;
            }).join("")}
          </div>
          ${laneCount ? `<div class="cal-events-row" style="grid-auto-rows:16px">
            ${placed.map(p=>`<div class="cal-event-bar" style="grid-column:${p.startCol+1} / ${p.endCol+2}; grid-row:${p.lane+1}; background:${catColor(p.course.categoryId)}" tabindex="0" role="button" onclick="openDay('${p.course.startDate}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();openDay('${p.course.startDate}')}" title="${esc(p.course.categoryName)}">${esc(p.course.categoryName)}</div>`).join("")}
          </div>` : ""}
        </div>`;
      }).join("")}
    </div>
    <div class="muted" style="text-align:center;margin-top:10px">點日期新增或查看課程．左右滑動切換月份</div>
  </div>`;
}
function prevMonth(){ slideMonth(-1); }
function nextMonth(){ slideMonth(1); }
function slideMonth(dir){
  const cal = document.getElementById("calRegion");
  if (!cal){
    viewMonth += dir; if (viewMonth<0){viewMonth=11;viewYear--;} else if (viewMonth>11){viewMonth=0;viewYear++;}
    render(); return;
  }
  cal.classList.remove("cal-enter-l","cal-enter-r");
  void cal.offsetWidth;
  cal.classList.add(dir<0 ? "cal-exit-r" : "cal-exit-l");
  setTimeout(()=>{
    viewMonth += dir;
    if (viewMonth<0){ viewMonth=11; viewYear--; } else if (viewMonth>11){ viewMonth=0; viewYear++; }
    render();
    const cal2 = document.getElementById("calRegion");
    if (cal2){
      cal2.classList.remove(dir<0?"cal-exit-r":"cal-exit-l");
      void cal2.offsetWidth;
      cal2.classList.add(dir<0 ? "cal-enter-l" : "cal-enter-r");
    }
  }, 130);
}
function bindCalendarSwipe(){
  const el = document.getElementById("calGrid");
  if (!el) return;
  let sx = 0;
  el.ontouchstart = e => { sx = e.touches[0].clientX; };
  el.ontouchend = e => {
    const dx = e.changedTouches[0].clientX - sx;
    if (dx > 50) prevMonth();
    else if (dx < -50) nextMonth();
  };
}

function renderHome(){
  return `${fbFail ? `<div class="err-banner">⚠️ 資料庫連線失敗，請檢查網路後再試一次。<button class="btn btn-ghost btn-sm" onclick="location.reload()">重新整理</button></div>` : ""}
    ${renderTodoCard()}
    ${renderCalendarCard()}`;
}

/* ================= 彈窗：當天課程 / 新增課程 ================= */
function openDay(dateStr){ modal = { type:"day", date:dateStr }; renderModalRoot(); }
function closeModal(){
  const ov = document.querySelector("#modalRoot .overlay");
  if (!ov){ modal = null; courseDraft = null; renderModalRoot(); return; }
  ov.classList.add("overlay-exit");
  const sheet = ov.querySelector(".sheet");
  if (sheet) sheet.classList.add("sheet-exit");
  setTimeout(()=>{ modal = null; courseDraft = null; renderModalRoot(); }, 140);
}
function closeModalBg(e){ if (e.target === e.currentTarget) closeModal(); }

function openAddCourse(dateStr){
  const first = allCategories()[0];
  courseDraft = { date: dateStr, categoryId: first.id, customName:"", endDate: addDaysStr(dateStr, first.days-1), reminderLeadDays: first.reminderLeadDays };
  modal = { type:"addCourse" };
  renderModalRoot();
}
function pickDraftCategory(id){
  const cat = allCategories().find(c=>c.id===id);
  courseDraft.categoryId = id;
  if (id !== "other") { courseDraft.endDate = addDaysStr(courseDraft.date, cat.days-1); courseDraft.reminderLeadDays = cat.reminderLeadDays; }
  renderModalRoot();
}
function draftStartChange(v){
  courseDraft.date = v;
  if (courseDraft.endDate < v) courseDraft.endDate = v;
  renderModalRoot();
}
function draftEndChange(v){
  courseDraft.endDate = v < courseDraft.date ? courseDraft.date : v;
  renderModalRoot();
}
async function saveCourse(){
  if (!fbReady) { alert("資料庫尚未連線，請稍後再試"); return; }
  const cat = allCategories().find(c=>c.id===courseDraft.categoryId);
  const name = courseDraft.categoryId==="other" ? courseDraft.customName.trim() : cat.name;
  if (!name) { alert("請輸入課程名稱"); return; }
  const startDate = courseDraft.date;
  const endDate = courseDraft.endDate < startDate ? startDate : courseDraft.endDate;
  const days = diffDaysStr(startDate, endDate) + 1;
  const reminderLeadDays = Math.max(0, Math.floor(Number(courseDraft.reminderLeadDays)||0));
  busy.courseSave = true; renderModalRoot();
  const { db, collection, addDoc } = window.fb;
  try {
    await addDoc(collection(db,"cp_courses"), {
      categoryId: courseDraft.categoryId, categoryName: name,
      startDate, endDate, days, reminderLeadDays, createdAt: Date.now()
    });
    modal = { type:"day", date:startDate };
  } catch(e){ alert("新增失敗："+e.message); }
  busy.courseSave = false; renderModalRoot();
}
function deleteCourse(id){
  deletingCourseIds.add(id); renderModalRoot();
  showToast("已刪除課程",
    ()=>{ deletingCourseIds.delete(id); const { db, doc, deleteDoc } = window.fb; deleteDoc(doc(db,"cp_courses",id)).catch(e=>alert("刪除失敗："+e.message)); },
    ()=>{ deletingCourseIds.delete(id); renderModalRoot(); }
  );
}

function renderModalRoot(){
  const root = document.getElementById("modalRoot");
  if (!modal) { root.innerHTML = ""; return; }
  if (modal.type === "day") root.innerHTML = renderDayModal();
  else if (modal.type === "addCourse") root.innerHTML = renderAddCourseModal();
}
function renderDayModal(){
  const dcs = dayCourses(modal.date);
  const dayT = dayTodos(modal.date);
  const high = isHighAccount();
  return `<div class="overlay" onclick="closeModalBg(event)"><div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-head"><b class="date-pill">${dateLabel(modal.date)}</b><button class="x" aria-label="關閉" onclick="closeModal()">${ICONS.x}</button></div>
    ${dcs.length ? dcs.map(c=>`<div class="course-row${deletingCourseIds.has(c.id)?' course-exit':''}">
        <span class="dot" style="background:${catColor(c.categoryId)}"></span>
        <div class="ci"><div class="cn">${esc(c.categoryName)}</div>
        <div class="cm">${c.startDate===c.endDate ? "當天課程" : c.startDate+" ～ "+c.endDate}・提前 ${c.reminderLeadDays} 天提醒</div></div>
        <button class="btn btn-red btn-sm" onclick="deleteCourse('${c.id}')">刪除</button>
      </div>`).join("") : `<div class="empty">這天還沒有安排課程</div>`}
    <button class="btn btn-main" style="width:100%;margin-top:14px" onclick="openAddCourse('${modal.date}')">＋ 新增課程</button>
    ${dayT.length ? `<div class="muted" style="margin:16px 0 6px">當天的指派待辦</div>${dayT.map(t=>{
        const deleting = deletingTodoIds.has(t.id);
        const cls = deleting?'todo-delete-exit':'';
        return `<div class="todo-item${cls?' '+cls:''}">
          <span class="status-tag ${t.done?'status-done':'status-pending'}">${t.done?ICONS.check:ICONS.clock}${t.done?'已完成':'未完成'}</span>
          <span class="t"><b>${esc(accountName(t.assignedTo))}</b>・${esc(t.text)}</span>
          ${high ? `<button class="del" aria-label="刪除待辦" onclick="deleteTodoBtn('${t.id}')">${ICONS.x}</button>` : ""}
        </div>`;
      }).join("")}` : ""}
  </div></div>`;
}
function renderAddCourseModal(){
  const cats = allCategories();
  const isOther = courseDraft.categoryId === "other";
  return `<div class="overlay" onclick="closeModalBg(event)"><div class="sheet" onclick="event.stopPropagation()">
    <div class="sheet-head"><b>新增課程</b><button class="x" aria-label="關閉" onclick="closeModal()">${ICONS.x}</button></div>
    <div class="field">
      <label>課程類別</label>
      <select onchange="pickDraftCategory(this.value)">
        ${cats.map(c=>`<option value="${c.id}" ${c.id===courseDraft.categoryId?"selected":""}>${esc(c.name)}</option>`).join("")}
      </select>
    </div>
    ${isOther ? `<div class="field"><label>課程名稱</label><input value="${esc(courseDraft.customName)}" oninput="courseDraft.customName=this.value" placeholder="請輸入課程名稱"></div>` : ""}
    <div class="field-row">
      <div class="field"><label>開始日期</label><input type="date" value="${courseDraft.date}" onchange="draftStartChange(this.value)"></div>
      <div class="field"><label>結束日期</label><input type="date" value="${courseDraft.endDate}" min="${courseDraft.date}" onchange="draftEndChange(this.value)"></div>
    </div>
    <div class="muted" style="margin:-6px 0 12px">共 <b>${diffDaysStr(courseDraft.date, courseDraft.endDate)+1}</b> 天</div>
    <div class="field"><label>提前幾天提醒開課</label><input type="number" min="0" value="${courseDraft.reminderLeadDays}" oninput="courseDraft.reminderLeadDays=Math.max(0,Math.floor(Number(this.value)||0))"></div>
    <button class="btn btn-main" style="width:100%" ${busy.courseSave?"disabled":""} onclick="saveCourse()">${busy.courseSave?"儲存中…":"儲存課程"}</button>
  </div></div>`;
}

/* ================= 後台：課程類別管理 ================= */
function addCatRow(){ catDraft.push({ id:"c"+Date.now(), name:"", days:1, reminderLeadDays:3 }); render(); }
function deleteCatRow(idx){ catDraft[idx]._removed = true; render(); }
function restoreCatRow(idx){ delete catDraft[idx]._removed; render(); }
function updateCatDraft(idx, field, value){
  if (field==="name") catDraft[idx].name = value;
  else catDraft[idx][field] = Math.max(field==="reminderLeadDays"?0:1, Math.floor(Number(value)||(field==="reminderLeadDays"?0:1)));
}
async function saveCategories(){
  const cleaned = catDraft.filter(c=>!c._removed && c.name && c.name.trim()).map(c=>({ id:c.id, name:c.name.trim(), days:c.days, reminderLeadDays:c.reminderLeadDays }));
  if (!cleaned.length) { alert("至少要保留一個課程類別"); return; }
  busy.catSave = true; render();
  const { db, doc, setDoc } = window.fb;
  try {
    await setDoc(doc(db,"cp_settings","app"), { ...settings, categories: cleaned }, { merge:true });
    showToast("課程類別已儲存");
  } catch(e){ alert("儲存失敗："+e.message); }
  busy.catSave = false; render();
}

/* ================= 後台：帳號管理 ================= */
function addAcctRow(){ acctDraft.push({ id:"acc"+Date.now(), name:"", password:"", role:"low" }); render(); }
function deleteAcctRow(idx){ acctDraft[idx]._removed = true; render(); }
function restoreAcctRow(idx){ delete acctDraft[idx]._removed; render(); }
function updateAcctDraft(idx, field, value){ acctDraft[idx][field] = value; }
async function saveAccounts(){
  const cleaned = acctDraft.filter(a=>!a._removed && a.name && a.name.trim() && a.password && a.password.trim())
    .map(a=>({ id:a.id, name:a.name.trim(), password:a.password.trim(), role: a.role==="high"?"high":"low" }));
  if (!cleaned.length) { alert("至少要保留一個帳號"); return; }
  busy.acctSave = true; render();
  const { db, doc, setDoc } = window.fb;
  try {
    await setDoc(doc(db,"cp_settings","app"), { ...settings, accounts: cleaned }, { merge:true });
    showToast("帳號已儲存");
  } catch(e){ alert("儲存失敗："+e.message); }
  busy.acctSave = false; render();
}

/* ================= 後台：指派總覽 ================= */
function renderAssignOverviewRows(){
  const rows = todos.slice().sort((a,b)=>{
    const ad=a.date||"", bd=b.date||"";
    return ad<bd?-1:(ad>bd?1:0);
  });
  if (!rows.length) return `<div class="empty">還沒有指派任何待辦</div>`;
  return rows.map(t=>`<div class="todo-item" style="max-height:none">
    <span class="t"><b>${esc(accountName(t.assignedTo))}</b>・${esc(t.date||"")}・${esc(t.text)}</span>
    <span class="status-tag ${t.done?'status-done':'status-pending'}">${t.done?"已完成":"未完成"}</span>
  </div>`).join("");
}

function renderSettings(){
  if (!catDraft) catDraft = JSON.parse(JSON.stringify(settings.categories));
  if (!acctDraft) acctDraft = JSON.parse(JSON.stringify(settings.accounts));
  return `${fbFail ? `<div class="err-banner">⚠️ 資料庫連線失敗，暫時無法儲存設定。<button class="btn btn-ghost btn-sm" onclick="location.reload()">重新整理</button></div>` : ""}
    <div class="card">
      <h3 class="sec"><span class="icon-badge">${ICONS.clipboard}</span> 指派總覽</h3>
      ${renderAssignOverviewRows()}
    </div>
    <div class="card">
      <h3 class="sec"><span class="icon-badge">${ICONS.tag}</span> 課程類別管理</h3>
      <div class="cat-head-row"><div>名稱</div><div>天數</div><div>提醒</div><div></div></div>
      ${catDraft.map((c,idx)=> c._removed
        ? `<div class="cat-row-removed"><span>已移除：${esc(c.name||"（未命名）")}</span><button class="btn btn-ghost btn-sm" onclick="restoreCatRow(${idx})">復原</button></div>`
        : `<div class="cat-row">
        <input value="${esc(c.name)}" placeholder="類別名稱" oninput="updateCatDraft(${idx},'name',this.value)">
        <input type="number" min="1" value="${c.days}" oninput="updateCatDraft(${idx},'days',this.value)">
        <input type="number" min="0" value="${c.reminderLeadDays}" oninput="updateCatDraft(${idx},'reminderLeadDays',this.value)">
        <button class="del" aria-label="刪除類別" onclick="deleteCatRow(${idx})">${ICONS.x}</button>
      </div>`).join("")}
      <button class="btn btn-ghost btn-sm" onclick="addCatRow()">＋ 新增類別</button>
      <div style="margin-top:12px"><button class="btn btn-main" style="width:100%" ${busy.catSave?"disabled":""} onclick="saveCategories()">${busy.catSave?"儲存中…":"儲存課程類別"}</button></div>
      <div class="muted" style="margin-top:8px">「其他（手動輸入）」為系統固定選項，新增課程時可自行輸入名稱，不需在此設定。</div>
    </div>
    <div class="card">
      <h3 class="sec"><span class="icon-badge">${ICONS.people}</span> 帳號管理</h3>
      <div class="acct-head-row"><div>姓名</div><div>密碼</div><div>權限</div><div></div></div>
      ${acctDraft.map((a,idx)=> a._removed
        ? `<div class="cat-row-removed"><span>已移除：${esc(a.name||"（未命名）")}</span><button class="btn btn-ghost btn-sm" onclick="restoreAcctRow(${idx})">復原</button></div>`
        : `<div class="acct-row">
        <input value="${esc(a.name)}" placeholder="姓名" oninput="updateAcctDraft(${idx},'name',this.value)">
        <input value="${esc(a.password)}" placeholder="密碼" oninput="updateAcctDraft(${idx},'password',this.value)">
        <select onchange="updateAcctDraft(${idx},'role',this.value)">
          <option value="low" ${a.role!=="high"?"selected":""}>低權限</option>
          <option value="high" ${a.role==="high"?"selected":""}>高權限</option>
        </select>
        <button class="del" aria-label="刪除帳號" onclick="deleteAcctRow(${idx})">${ICONS.x}</button>
      </div>`).join("")}
      <button class="btn btn-ghost btn-sm" onclick="addAcctRow()">＋ 新增帳號</button>
      <div style="margin-top:12px"><button class="btn btn-main" style="width:100%" ${busy.acctSave?"disabled":""} onclick="saveAccounts()">${busy.acctSave?"儲存中…":"儲存帳號"}</button></div>
      <div class="muted" style="margin-top:8px">高權限可以指派待辦給任何人、管理課程類別與帳號；低權限只能看自己被指派的待辦並勾選完成。</div>
    </div>`;
}

render();
</script>
</body>
</html>
